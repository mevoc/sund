# Minimal single-service Sund deployment.
#
# This runs just the relay. A real self-hosting stack — a UnifiedPush distributor
# (ntfy) for Android wake-up and a TLS-terminating reverse proxy — is a consumer
# concern; see github.com/mevoc/family-beacon. Sund speaks plain HTTP and must
# sit behind a proxy for any internet-facing deployment.
#
# Quick start:
#   cp .env.example .env         # then edit if you like
#   docker compose up -d
#   docker compose exec sund /sund admin account create   # first account + invite
#
# The image is private while the repo is: run `docker login ghcr.io` first, or
# make the package public.

services:
  sund:
    image: ${SUND_IMAGE:-ghcr.io/mevoc/sund:latest}
    restart: unless-stopped
    ports:
      - "${SUND_PORT:-5870}:5870"
    volumes:
      - sund-data:/data
    # The image already defaults these; shown here so the deployment is legible.
    # Pinned TLS is the default and the CA lives on the volume, so the address
    # clients pinned keeps working across container replacements. Get the
    # fingerprint with:
    #   docker compose exec sund /sund cert fingerprint --tls-dir /data/tls
    # For WebPKI mode instead — a proxy terminating TLS in front — set
    # SUND_HTTP: "1" and drop the published port to the proxy's network.
    environment:
      SUND_ADDR: ":5870"
      SUND_DB: "/data/sund.db"
      SUND_TLS_DIR: "/data/tls"
    # distroless has no shell or curl, so the binary probes itself.
    healthcheck:
      test: ["CMD", "/sund", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sund-data:
