name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  system:
    name: System suite (beaconsim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The system suite compiles and drives the real binary, so it needs Go too.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: pytest (builds and drives the real sund binary)
        working-directory: tests
        run: uv run pytest -q
