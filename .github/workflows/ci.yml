name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  system:
    name: System suite (beaconsim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The system suite compiles and drives the real binary, so it needs Go too.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: pytest (builds and drives the real sund binary)
        working-directory: tests
        run: uv run pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [go, system] # don't publish an image the suites don't vouch for
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Build a single-arch image, load it, and prove the real artifact serves
      # /health before we consider publishing.
      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: sund:smoke
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /health
        run: |
          docker run -d --name sund-smoke -p 5870:5870 sund:smoke
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5870/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs sund-smoke || true
          if [ "$ok" != "1" ]; then echo "health check failed"; docker rm -f sund-smoke; exit 1; fi
          echo "health: $(curl -fsS http://localhost:5870/health)"
          docker rm -f sund-smoke

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
