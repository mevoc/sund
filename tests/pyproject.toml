[project]
name = "beaconsim"
version = "0.0.0"
description = "Headless Family Beacon client mockup and Sund system-test suite"
requires-python = ">=3.12"
dependencies = [
    "pynacl>=1.5",
    "httpx>=0.27",
    "pytest>=8.0",
    "pyopenssl>=24.0",
]

# Not an installable package — uv only manages the test environment; beaconsim
# is imported from the source tree by pytest.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
